# Pages CMS Configuration for PG Gurukul
# Documentation: https://pagescms.org/docs/configuration

media:
  # First entry is the default media source (used by all `type: image` fields).
  - name: images
    label: Images
    input: public/images
    output: /images
  - name: videos
    label: Videos
    input: public/videos
    output: /videos
    extensions: [mp4, webm]

content:
  # MARK: Site-wide settings
  - name: site
    label: Website Settings
    path: content/site.json
    type: file
    fields:
      - name: siteName
        label: Website Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Website Description
        type: text
      - name: phone
        label: Contact Number
        type: string
      - name: email
        label: Contact Email Address
        type: string
      - name: location
        label: Location
        type: string
      - name: mapEmbedUrl
        label: Google Maps Embed URL
        type: string

  # MARK: Hero Section
  - name: hero
    label: Hero Section
    path: content/hero.json
    type: file
    fields:
      - name: displayBadge
        label: Display Badge
        type: boolean
      - name: badge
        label: Badge Text
        type: string
      - name: backgroundImage
        label: Background Image
        type: image
      - name: title
        label: Title (Line 1)
        type: string
      - name: titleHighlight
        label: Title (Line 2) (with color gradient)
        type: string
      - name: description
        label: Description
        type: text
      - name: primaryButtonText
        label: Primary Button Text
        type: string
      - name: primaryButtonLink
        label: Primary Button Link
        type: string
        description: (Provide the string present after domain name, for example, if URL is "www.example.com/courses/paragliding" then provide "courses/paragliding")
      - name: stats
        label: Statistics
        type: object
        list: true
        fields:
          - name: value
            label: Value
            type: string
          - name: label
            label: Label
            type: string

  # MARK: About Instructor Section
  - name: instructor
    label: Instructor Section
    path: content/instructor.json
    type: file
    fields:
      - name: name
        label: Instructor Name
        type: string
      - name: title
        label: Title/Role
        type: string
      - name: photo
        label: Photo
        type: image
      - name: sectionTitle
        label: Section Title
        type: string
      - name: paragraphs
        label: Description Paragraphs
        type: text
        list: true
      - name: buttonText
        label: Button Text
        type: string
      - name: achievements
        label: Achievements
        type: object
        list: true
        fields:
          - name: icon
            label: Icon Name
            type: string
            description: "MUI icon name: FlightIcon, EmojiEventsIcon, PublicIcon, VerifiedUserIcon"
          - name: value
            label: Value
            type: string
          - name: label
            label: Label
            type: string

  # MARK: Team Section
  - name: team
    label: Team Section
    path: content/team.json
    type: file
    fields:
      - name: sectionTitle
        label: Section Title
        type: string
      - name: showButtonText
        label: Show Button Text
        type: string
      - name: hideButtonText
        label: Hide Button Text
        type: string
      - name: teamExpandedByDefault
        label: Team Section Expanded By Default
        type: boolean
      - name: members
        label: Team Members
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: role
            label: Role
            type: string
          - name: flyingSince
            label: Flying Since (Year)
            type: string
            required: false
          - name: qualification
            label: Qualification
            type: string
            required: false
          - name: photo
            label: Photo
            type: image
          - name: bio
            label: Bio Paragraphs
            type: text
            list: true

  # MARK: Certifications Section
  - name: certifications
    label: Certifications Section
    path: content/certifications.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text
      - name: items
        label: Affiliation Items
        type: object
        list: true
        fields:
          - name: name
            label: Organization Name
            type: string
          - name: image
            label: Logo Image
            type: image
          - name: description
            label: Description
            type: string
          - name: link
            label: Link
            type: string
            description: "Leave empty if no link is needed"
            required: false

  # MARK: Why Train With Us Section
  - name: whyTrainWithUs
    label: Why Train With Us Section (The content of this section can only be edited in the code. Please contact the developer to edit this section.)
    path: content/why-train-with-us.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text

  # MARK: Courses Section
  - name: courses
    label: Courses
    path: content/courses.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text
      - name: items
        label: Course List
        type: object
        list: true
        fields:
          - name: title
            label: Course Title
            type: string
          - name: image
            label: Course Image
            type: image
            description: "Leave empty to use the default course image."
            required: false
          - name: primaryDescription
            label: Primary Description
            type: string
          - name: secondaryDescription
            label: Secondary Description
            type: text
          - name: duration
            label: Duration
            type: string
          - name: venue
            label: Venue/Location
            type: string
          - name: cost
            label: Cost
            type: string
          - name: level
            label: Level
            type: select
            options:
              values:
                - Beginner
                - Intermediate
                - Advanced
          - name: tag
            label: Tag
            type: string
          - name: featured
            label: Featured Course
            type: boolean
          - name: formType
            label: Application Form
            type: select
            description: "Which form opens when someone clicks Apply Now. Choose 'SIV application' for SIV courses (asks for flying hours, equipment and flight logs). Leave empty or choose 'Standard application' for all other courses."
            required: false
            options:
              values:
                - name: standard
                  label: Standard application
                - name: siv
                  label: SIV application
          - name: schedule
            label: Schedule
            type: object
            fields:
              # - name: note
              #   label: Schedule Note
              #   type: string
              #   description: "Free-text note shown above session dates (e.g. 'Spring/Summer 2026 start dates — Venue: Bir / Billing')"
              #   required: false
              - name: sessions
                label: Batch Start Dates
                type: string
                list: true
                description: "One date per entry (e.g. 'Feb 16, 2026'). Leave empty if dates are TBD."

  # MARK: Testimonials Section
  - name: testimonials
    label: Testimonials
    path: content/testimonials.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text
      - name: items
        label: Testimonials
        type: object
        list: true
        description: "It is recommended to keep even number of testimonials to make the carousel look balanced."
        fields:
          - name: name
            label: Name
            type: string
          - name: role
            label: Role/Course
            type: string
          - name: text
            label: Testimonial Text
            type: text
            description: "Maximum characters allowed: 450 (beyond this, the testimonial card will become very tall and may look unpleasant)."
          - name: rating
            label: Rating (1-5)
            type: number
          - name: photo
            label: Photo
            type: image
            required: false
          - name: link
            label: Link
            type: string
            description: "Leave empty if no link is needed"
            required: false

  # MARK: FAQ Section
  - name: faqs
    label: FAQs
    path: content/faqs.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text
      - name: items
        label: FAQ Items
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text
      - name: ctaTitle
        label: CTA Title
        type: string
      - name: ctaDescription
        label: CTA Description
        type: string
      - name: ctaLinkText
        label: CTA Link Text
        type: string

  # MARK: Reels Section
  - name: reels
    label: Reels
    path: content/reels.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text
        description: "The Instagram handle below is appended as a link at the end of this text."
      - name: instagramHandle
        label: Instagram Handle
        type: string
        description: "Shown as the link text (e.g. @pg_gurukul)"
      - name: instagramUrl
        label: Instagram URL
        type: string
      - name: items
        label: Reels
        type: object
        list: true
        description: "Drag to reorder. A reel without a video shows an empty placeholder slot linking to Instagram."
        fields:
          - name: video
            label: Video (MP4)
            type: file
            options:
              media: videos
            required: false
          - name: poster
            label: Poster Image (still frame shown before play)
            type: image
            required: false
          - name: caption
            label: Caption
            type: string
            required: false

  # MARK: Gallery Section
  - name: gallery
    label: Gallery
    path: content/gallery.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text
      - name: images
        label: Gallery Images
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt Text/Caption
            type: string
          - name: span
            label: Size
            type: select
            options:
              values:
                - small
                - large
                - wide
          - name: link
            label: Link
            type: string
            description: "Leave empty if no link is needed"
            required: false

  # MARK: Contact Section
  - name: contact
    label: Contact Section
    path: content/contact.json
    type: file
    fields:
      - name: badge
        label: Badge Text
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Description
        type: text
      - name: formTitle
        label: Form Title
        type: string
      - name: formDescription
        label: Form Description
        type: string
      - name: buttonText
        label: Submit Button Text
        type: string

  # MARK: Footer Section
  - name: footer
    label: Footer
    path: content/footer.json
    type: file
    fields:
      - name: description
        label: Footer Description
        type: text
      - name: socialLinks
        label: Social Media Links
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - Facebook
                - Instagram
                - YouTube
                - LinkedIn
                - Twitter
          - name: url
            label: URL
            type: string
      - name: copyrightText
        label: Copyright Text
        type: string

  # MARK: Navigation
  - name: navigation
    label: Navigation
    path: content/navigation.json
    type: file
    fields:
      - name: items
        label: Nav Items
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: href
            label: Link
            type: string
          - name: withCaret
            label: Show Dropdown Arrow
            type: boolean
      - name: ctaText
        label: CTA Button Text
        type: string
      - name: ctaLink
        label: CTA Button Link
        type: string
